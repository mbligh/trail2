org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true

# Keep the Android app's external Kotlin plugin while the shared library uses the
# Android KMP plugin. The tested MapLibre Compose toolchain uses the same opt-outs.
android.builtInKotlin=false
android.newDsl=false

# AGP 9 otherwise creates only debug unit tests; retain both CI build variants.
android.onlyEnableUnitTestForTheTestedBuildType=false
