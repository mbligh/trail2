name: iOS shared framework and Metal simulator smoke test
on:
  push:
    branches: [main]
    paths: ['shared/**', 'ios/**', 'experiments/ios-map/**', 'basemaps.json', 'offline-maps.json', 'maps/**', 'tools/prepare_maps', '*.gradle.kts', 'gradle.properties', 'gradle/**', 'gradlew*', '.github/workflows/ios-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trail-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2
      - uses: actions/cache@v5
        with:
          path: .map-downloads
          key: offline-maps-${{ hashFiles('offline-maps.json', 'basemaps.json', 'tools/prepare_maps') }}
      - name: Build the same Tewksbury seed bundle as Android
        run: |
          python tools/test_offline_maps
          python tools/prepare_maps --output experiments/ios-map/build/mapAssets
      - uses: actions/upload-artifact@v6
        with:
          name: Trail-iOS-map-assets
          path: experiments/ios-map/build/mapAssets/
  ios:
    needs: assets
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Configure toolchains
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: actions/cache/restore@v5
        id: konan
        with:
          path: ~/.konan
          key: trail-konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'experiments/ios-map/build.gradle.kts') }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: trail-ios-gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('*.gradle.kts', 'gradle/**', 'shared/**', 'experiments/ios-map/**/*.kt') }}
          restore-keys: trail-ios-gradle-${{ runner.os }}-${{ runner.arch }}-
      - name: Link shared iPhone framework
        run: ./gradlew --no-daemon --build-cache :shared:linkDebugFrameworkIosArm64
      - name: Link shared simulator framework
        run: ./gradlew --no-daemon --build-cache :shared:linkDebugFrameworkIosSimulatorArm64
      - name: Run shared tests on iOS
        run: ./gradlew --no-daemon --build-cache :shared:iosSimulatorArm64Test
      - name: Link optimized Metal simulator framework
        run: ./gradlew --no-daemon --build-cache :iosProbe:linkReleaseFrameworkIosSimulatorArm64
      - name: Link optimized Metal iPhone framework
        run: ./gradlew --no-daemon --build-cache :iosProbe:linkReleaseFrameworkIosArm64
      - uses: actions/download-artifact@v6
        with:
          name: Trail-iOS-map-assets
          path: experiments/ios-map/build/mapAssets/
      - name: Install image tooling
        run: python -m pip install Pillow==11.3.0
      - name: Build optimized simulator and unsigned device apps without Apple credentials
        run: |
          bash experiments/ios-map/build_probe_app simulator release
          bash experiments/ios-map/build_probe_app device release
      - name: Package Trail 2 unsigned device app with production identity
        run: python ios/package_device
      - name: Package app bundles with executable permissions
        run: |
          ditto -c -k --sequesterRsrc --keepParent experiments/ios-map/build/TrailIosProbe.app experiments/ios-map/build/TrailIosProbe-simulator.zip
          ditto -c -k --sequesterRsrc --keepParent experiments/ios-map/build/TrailIosProbe-device.app experiments/ios-map/build/TrailIosProbe-device-unsigned.zip
      - name: Verify synthetic Metal rendering in the simulator
        run: |
          python experiments/ios-map/smoke_simulator.py
      - name: Verify native recording and relaunch rendering
        run: python experiments/ios-map/platform_simulator
      - name: Verify bundled offline maps across relaunch
        run: python experiments/ios-map/offline_simulator
      - name: Verify shared KML refresh cache and visibility across relaunch
        run: python experiments/ios-map/trails_simulator
      - name: Verify basemap switches camera persistence and offline raster cache
        run: python experiments/ios-map/basemaps_simulator
      - name: Verify contour HTTP ranges layer toggles and cold offline replay
        run: python experiments/ios-map/layers_simulator
      - name: Verify the shared legend and dismissal
        run: python experiments/ios-map/legend_simulator
      - name: Verify bundled local PMTiles layer controls without HTTP
        run: python experiments/ios-map/layers_simulator --local
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Trail-iOS-simulator-check
          path: |
            shared/build/bin/iosArm64/debugFramework/
            shared/build/bin/iosSimulatorArm64/debugFramework/
            shared/build/reports/tests/
            shared/build/test-results/
            experiments/ios-map/build/TrailIosProbe-simulator.zip
            experiments/ios-map/build/TrailIosProbe-device-unsigned.zip
            experiments/ios-map/build/Trail2-device-unsigned.ipa
            experiments/ios-map/build/smoke/
          if-no-files-found: warn
      - uses: actions/cache/save@v5
        if: always() && !cancelled() && steps.konan.outputs.cache-hit != 'true'
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}
