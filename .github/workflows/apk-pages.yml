name: Build and publish APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'basemaps.json'
      - 'offline-maps.json'
      - 'maps/**'
      - 'tools/prepare_maps'
      - 'tools/test_offline_maps'
      - 'tools/check_native_alignment'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - 'development-signing.jks'
      - '.github/workflows/apk-pages.yml'
      - 'site/**'
  pull_request:
    paths:
      - 'app/**'
      - 'shared/**'
      - 'basemaps.json'
      - 'offline-maps.json'
      - 'maps/**'
      - 'tools/prepare_maps'
      - 'tools/test_offline_maps'
      - 'tools/check_native_alignment'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - 'development-signing.jks'
      - '.github/workflows/apk-pages.yml'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trail2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install offline map builder
        run: python -m pip install shapely==2.1.2
      - name: Cache offline map downloads
        uses: actions/cache@v5
        with:
          path: .map-downloads
          key: offline-maps-${{ hashFiles('offline-maps.json', 'basemaps.json', 'tools/prepare_maps') }}
      - name: Validate offline tile selection
        run: python tools/test_offline_maps
      # Commit time is deterministic across retries and increases with each new version.
      # Minutes since the Unix epoch are comfortably above the old fixed code (18)
      # while remaining below Android's maximum versionCode for centuries.
      - name: Assign monotonically increasing sideload APK version
        run: |
          commit_time="$(git show -s --format=%ct HEAD)"
          version_code="$((commit_time / 60))"
          if [ "$version_code" -le 18 ]; then
            echo "::error::Invalid APK version code: $version_code"
            exit 1
          fi
          echo "TRAIL_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Sideload APK versionCode=$version_code"
      - name: Test, lint, and build APK
        run: ./gradlew --no-daemon :shared:jvmTest testDebugUnitTest lintDebug assembleDebug
      - name: Verify complete bundled offline coverage
        run: python tools/test_offline_maps
      - name: Verify 16 KiB native alignment
        run: |
          python tools/check_native_alignment app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare download site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp app/build/outputs/apk/debug/app-debug.apk _site/Trail2.apk
          cd _site
          sha256sum Trail2.apk > Trail2.apk.sha256
      - name: Save APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Trail2-apk
          path: _site/Trail2.apk
          if-no-files-found: error
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy download site
        id: deployment
        uses: actions/deploy-pages@v5
