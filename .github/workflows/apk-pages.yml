name: Build and publish APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'basemaps.json'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - 'development-signing.jks'
      - '.github/workflows/apk-pages.yml'
      - 'site/**'
  pull_request:
    paths:
      - 'app/**'
      - 'basemaps.json'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - 'development-signing.jks'
      - '.github/workflows/apk-pages.yml'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trail2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint, and build APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Prepare download site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp app/build/outputs/apk/debug/app-debug.apk _site/Trail2.apk
          cd _site
          sha256sum Trail2.apk > Trail2.apk.sha256
      - name: Save APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Trail2-apk
          path: _site/Trail2.apk
          if-no-files-found: error
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy download site
        id: deployment
        uses: actions/deploy-pages@v5
