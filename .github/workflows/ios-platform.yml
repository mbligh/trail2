name: iOS platform adapter tests
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-platform.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trail-ios-platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Test native recording maps and trail cache adapters
        run: swift test --package-path ios/TrailPlatform
      - name: Typecheck native iOS location APIs
        run: |
          xcrun --sdk iphonesimulator swiftc -typecheck -parse-as-library \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target arm64-apple-ios15.5-simulator \
            ios/TrailPlatform/Sources/TrailPlatform/*.swift
