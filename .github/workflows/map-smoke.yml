name: MapLibre native smoke tests
on:
  push:
    branches: [main, codex/maplibre-migration]
    paths: ['shared/**', 'app/**', 'basemaps.json', 'offline-maps.json', 'maps/**', 'tools/prepare_maps', 'tools/test_offline_maps', '.github/workflows/map-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maplibre-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: python -m pip install shapely==2.1.2
      - uses: actions/cache@v5
        with:
          path: .map-downloads
          key: offline-maps-${{ hashFiles('offline-maps.json', 'basemaps.json', 'tools/prepare_maps') }}
      - name: Build and verify
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          ./gradlew --no-daemon :shared:jvmTest testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
          python tools/test_offline_maps
      - name: Install emulator
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/trail-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n trail-test -k 'system-images;android-35;google_apis;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/trail-test.avd" --force
          printf 'avd.ini.encoding=UTF-8\npath=%s\n' "$ANDROID_AVD_HOME/trail-test.avd" > "$ANDROID_AVD_HOME/trail-test.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd trail-test -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -camera-back none -camera-front none > /tmp/emulator.log 2>&1 &
          timeout 180 adb wait-for-device || { cat /tmp/emulator.log; exit 1; }
          for attempt in $(seq 1 120); do
            if adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'; then
              adb shell input keyevent 82
              adb shell settings put global window_animation_scale 0
              adb shell settings put global transition_animation_scale 0
              adb shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 2
          done
          cat /tmp/emulator.log
          exit 1
      - name: Exercise native rendering, GPS and three-button system-bar bounds
        run: |
          adb shell cmd overlay enable-exclusive --user 0 --category com.android.internal.systemui.navbar.threebutton
          ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Verify gesture navigation and portrait camera-cutout bounds
        run: |
          adb shell cmd overlay enable-exclusive --user 0 --category com.android.internal.systemui.navbar.gestural
          adb shell cmd overlay enable --user 0 com.android.internal.display.cutout.emulation.tall
          ./gradlew --no-daemon connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=net.pocketmap.ScreenInsetsTest
      - name: Verify landscape system-bar and cutout bounds
        run: |
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          ./gradlew --no-daemon connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=net.pocketmap.ScreenInsetsTest
      - name: Collect screenshots and logs
        if: always()
        run: |
          mkdir -p smoke-results
          timeout 10 adb pull /data/local/tmp/maplibre-offline.png smoke-results/ || true
          timeout 10 adb pull /data/local/tmp/trail-insets/. smoke-results/ || true
          timeout 10 adb logcat -d > smoke-results/logcat.txt || true
          cp /tmp/emulator.log smoke-results/ || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: maplibre-smoke-results
          path: |
            smoke-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
