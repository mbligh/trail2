name: MapLibre native smoke tests
on:
  push:
    branches: [main, codex/maplibre-migration]
    paths: ['app/**', 'basemaps.json', 'offline-maps.json', 'maps/**', 'tools/prepare_maps', 'tools/test_offline_maps', '.github/workflows/map-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: python -m pip install shapely==2.1.2
      - uses: actions/cache@v5
        with:
          path: .map-downloads
          key: offline-maps-${{ hashFiles('offline-maps.json', 'basemaps.json', 'tools/prepare_maps') }}
      - name: Build and verify
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
          python tools/test_offline_maps
      - name: Install emulator
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd -n trail-test -k 'system-images;android-35;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd trail-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none > /tmp/emulator.log 2>&1 &
          timeout 180 adb wait-for-device || { cat /tmp/emulator.log; exit 1; }
          for attempt in $(seq 1 120); do
            if adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'; then
              adb shell input keyevent 82
              adb shell settings put global window_animation_scale 0
              adb shell settings put global transition_animation_scale 0
              adb shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 2
          done
          cat /tmp/emulator.log
          exit 1
      - name: Exercise native offline rendering, cache and GPS selection
        run: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Collect screenshots and logs
        if: always()
        run: |
          mkdir -p smoke-results
          adb pull /sdcard/Android/data/mbligh.trail/files/maplibre-offline.png smoke-results/ || true
          adb logcat -d > smoke-results/logcat.txt || true
          cp /tmp/emulator.log smoke-results/ || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: maplibre-smoke-results
          path: |
            smoke-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
