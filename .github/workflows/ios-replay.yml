name: Replay iOS probe diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-replay.yml', 'tools/ios_probe_replay', 'experiments/ios-map/smoke_simulator.py']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed iOS smoke run containing the simulator app ZIP (blank = latest)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: trail-ios-replay
  cancel-in-progress: true
jobs:
  replay:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select compiled probe
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED_RUN: ${{ inputs.run_id }}
        run: |
          run_id="$REQUESTED_RUN"
          if [ -z "$run_id" ]; then
            run_id="$(gh api "repos/$REPO/actions/workflows/ios-smoke.yml/runs?branch=main&event=push&status=completed&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          case "$run_id" in ''|*[!0-9]*) echo "Invalid source run"; exit 1 ;; esac
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Replaying compiled probe from run $run_id"
      - uses: actions/download-artifact@v6
        with:
          name: Trail-iOS-simulator-check
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: replay-input
      - name: Restore simulator application
        run: |
          mkdir -p experiments/ios-map/build
          ditto -x -k replay-input/experiments/ios-map/build/TrailIosProbe-simulator.zip experiments/ios-map/build
          codesign --verify --deep --strict experiments/ios-map/build/TrailIosProbe.app
      - name: Capture console, crash reports and rendered evidence
        run: |
          python -m pip install Pillow==11.3.0
          python -m py_compile tools/ios_probe_replay
          python tools/ios_probe_replay
      - name: Require shared map rendering from the compiled probe
        run: python experiments/ios-map/smoke_simulator.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Trail-iOS-replay-evidence
          path: |
            experiments/ios-map/build/replay/
            experiments/ios-map/build/smoke/
