name: Experimental MapLibre Compose API build

on:
  push:
    branches: [main]
    paths:
      - 'experiments/maplibre-compose/**'
      - '.github/workflows/maplibre-compose-probe.yml'
  pull_request:
    paths:
      - 'experiments/maplibre-compose/**'
      - '.github/workflows/maplibre-compose-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          # SDK 37 preview uses a .0 directory, while some AGP versions look for 37.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install offline map builder
        run: python -m pip install shapely==2.1.2
      - uses: actions/cache@v5
        with:
          path: .map-downloads
          key: offline-maps-${{ hashFiles('offline-maps.json', 'basemaps.json', 'tools/prepare_maps') }}
      - name: Build isolated Compose probe with real Tewksbury assets
        run: gradle --no-daemon -p experiments/maplibre-compose :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Launch Android emulator
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/compose-probe-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n compose-probe -k 'system-images;android-35;google_apis;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/compose-probe.avd" --force
          printf 'avd.ini.encoding=UTF-8\npath=%s\n' "$ANDROID_AVD_HOME/compose-probe.avd" > "$ANDROID_AVD_HOME/compose-probe.ini"
          "$ANDROID_HOME/emulator/emulator" -avd compose-probe -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot > /tmp/compose-probe-emulator.log 2>&1 &
          timeout 180 adb wait-for-device || { cat /tmp/compose-probe-emulator.log; exit 1; }
          for attempt in $(seq 1 120); do
            if adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'; then
              adb shell input keyevent 82
              exit 0
            fi
            sleep 2
          done
          cat /tmp/compose-probe-emulator.log
          exit 1
      - name: Verify real offline resource rendering
        run: |
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          gradle --no-daemon -p experiments/maplibre-compose :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=net.pocketmap.composeprobe.OfflineRenderTest
      - name: Warm actual NJ contour ranges online
        run: |
          adb shell svc wifi enable
          adb shell svc data enable
          adb install -r experiments/maplibre-compose/app/build/outputs/apk/debug/app-debug.apk
          adb install -r experiments/maplibre-compose/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          # am instrument preserves app data between the two invocations. Gradle's
          # connected test task may uninstall the app at the end of a run.
          mkdir -p experiments/maplibre-compose/smoke
          adb shell am instrument -w \
            -e class net.pocketmap.composeprobe.LiveContourRenderTest#warmRealContoursOnline \
            net.pocketmap.composeprobe.test/androidx.test.runner.AndroidJUnitRunner \
            | tee experiments/maplibre-compose/smoke/real-contours-online.txt
          grep -q 'OK (1 test)' experiments/maplibre-compose/smoke/real-contours-online.txt
      - name: Replay actual NJ contours after process restart without networking
        run: |
          adb shell am force-stop net.pocketmap.composeprobe
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell am instrument -w \
            -e class net.pocketmap.composeprobe.LiveContourRenderTest#replayRealContoursOffline \
            net.pocketmap.composeprobe.test/androidx.test.runner.AndroidJUnitRunner \
            | tee experiments/maplibre-compose/smoke/real-contours-offline.txt
          grep -q 'OK (1 test)' experiments/maplibre-compose/smoke/real-contours-offline.txt
      - name: Capture renderer logs
        if: always()
        run: |
          mkdir -p experiments/maplibre-compose/smoke
          timeout 10 adb logcat -d > experiments/maplibre-compose/smoke/logcat.txt || true
          cp /tmp/compose-probe-emulator.log experiments/maplibre-compose/smoke/ || true
          timeout 20 adb pull /sdcard/Android/data/net.pocketmap.composeprobe/files/. experiments/maplibre-compose/smoke/ || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ComposeProbeSmoke
          path: |
            experiments/maplibre-compose/smoke/
            experiments/maplibre-compose/app/build/reports/androidTests/
            experiments/maplibre-compose/app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: MaplibreComposeProbe
          path: experiments/maplibre-compose/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
