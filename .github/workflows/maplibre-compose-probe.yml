name: Experimental MapLibre Compose API build

on:
  push:
    branches: [main]
    paths:
      - 'experiments/maplibre-compose/**'
      - '.github/workflows/maplibre-compose-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build isolated Compose probe
        run: ./gradlew --no-daemon -p experiments/maplibre-compose :app:assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: MaplibreComposeProbe
          path: experiments/maplibre-compose/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
