name: Experimental MapLibre Compose API build

on:
  push:
    branches: [main]
    paths:
      - 'experiments/maplibre-compose/**'
      - '.github/workflows/maplibre-compose-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          # SDK 37 preview uses a .0 directory, while some AGP versions look for 37.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build isolated Compose probe
        run: gradle --no-daemon -p experiments/maplibre-compose :app:assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: MaplibreComposeProbe
          path: experiments/maplibre-compose/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
