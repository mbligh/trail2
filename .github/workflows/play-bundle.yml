name: Build and upload Play Store bundle
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'basemaps.json'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/play-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trail2-play
  cancel-in-progress: false
jobs:
  configuration:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check signing and Play upload credentials
        id: check
        env:
          UPLOAD_KEY: ${{ secrets.TRAIL_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_PASSWORD: ${{ secrets.TRAIL_UPLOAD_PASSWORD }}
          PLAY_ACCOUNT: ${{ secrets.TRAIL_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$UPLOAD_KEY" ] && [ -n "$UPLOAD_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add TRAIL_UPLOAD_KEYSTORE_BASE64 and TRAIL_UPLOAD_PASSWORD repository secrets to enable signed Play bundles."
          fi
          if [ -n "$PLAY_ACCOUNT" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add TRAIL_PLAY_SERVICE_ACCOUNT_JSON to enable automatic internal-track uploads."
          fi
  bundle:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TRAIL_UPLOAD_KEYSTORE: ${{ github.workspace }}/.private-signing/trail-upload.p12
      TRAIL_UPLOAD_PASSWORD: ${{ secrets.TRAIL_UPLOAD_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore upload key
        env:
          UPLOAD_KEY: ${{ secrets.TRAIL_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          mkdir -p .private-signing
          printf '%s' "$UPLOAD_KEY" | base64 --decode > "$TRAIL_UPLOAD_KEYSTORE"
      - name: Assign unique Play version code
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: echo "TRAIL_VERSION_CODE=$((10000 + RUN_NUMBER * 100 + RUN_ATTEMPT))" >> "$GITHUB_ENV"
      - name: Test, lint, and build release bundle
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease bundleRelease
      - name: Verify bundle signature
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > .private-signing/verification.txt
          cat .private-signing/verification.txt
          grep -q 'jar verified' .private-signing/verification.txt
      - name: Save Play upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Trail-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      # Explicit repository variable guards against publishing before the separate
      # mbligh.trail listing and its credentials are configured in Play Console.
      - name: Upload and publish to internal testing
        if: needs.configuration.outputs.publish == 'true' && vars.ENABLE_TRAIL2_PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.TRAIL_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: mbligh.trail
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: Trail 2 build ${{ github.run_number }}.${{ github.run_attempt }}
      - name: Remove upload key
        if: always()
        run: rm -rf .private-signing
